<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unity WebGL Player | Granny 3</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #231F20;
    }

    #unity-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #231F20;
      color: white;
      font-family: Arial, sans-serif;
      font-size: 16px;
      z-index: 9999;
    }

    #error {
      position: fixed;
      left: 20px;
      right: 20px;
      top: 20px;
      color: #ff5555;
      font-family: monospace;
      white-space: pre-wrap;
      z-index: 10000;
      display: none;
    }
  </style>
</head>

<body>

<canvas id="unity-canvas" tabindex="-1"></canvas>

<div id="loading">Loading game...</div>
<div id="error"></div>

<script>
async function loadSplitFile(basePath, parts) {
    const chunks = [];

    for (let i = 1; i <= parts; i++) {
        const partNumber = String(i).padStart(2, "0");
        const url = basePath + ".part" + partNumber;

        document.getElementById("loading").textContent =
            "Loading " + url + " (" + i + "/" + parts + ")";

        const response = await fetch(url, {
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error(
                "Failed to load " + url +
                " (HTTP " + response.status + ")"
            );
        }

        chunks.push(await response.arrayBuffer());
    }

    let totalSize = 0;

    for (const chunk of chunks) {
        totalSize += chunk.byteLength;
    }

    const combined = new Uint8Array(totalSize);

    let offset = 0;

    for (const chunk of chunks) {
        combined.set(new Uint8Array(chunk), offset);
        offset += chunk.byteLength;
    }

    return new Blob([combined]);
}


async function createGame() {
    try {

        /*
         * Your files:
         *
         * FinalBuild.data.part1
         * FinalBuild.data.part2
         * ...
         * FinalBuild.data.part20
         *
         * FinalBuild.wasm.part1
         * FinalBuild.wasm.part2
         */

        const dataBlob = await loadSplitFile(
            "Build/FinalBuild.data",
            20
        );

        const wasmBlob = await loadSplitFile(
            "Build/FinalBuild.wasm",
            2
        );

        document.getElementById("loading").textContent =
            "Starting Unity...";

        /*
         * Create temporary Blob URLs.
         */
        const dataUrl = URL.createObjectURL(dataBlob);
        const wasmUrl = URL.createObjectURL(wasmBlob);

        /*
         * Load Unity's normal loader.
         */
        const script = document.createElement("script");

        script.src = "Build/FinalBuild.loader.js";

        script.onload = async function () {

            const canvas =
                document.querySelector("#unity-canvas");

            await createUnityInstance(canvas, {

                dataUrl: dataUrl,

                frameworkUrl:
                    "Build/FinalBuild.framework.js",

                codeUrl: wasmUrl,

                streamingAssetsUrl:
                    "StreamingAssets",

                companyName:
                    "DVloper",

                productName:
                    "Granny 3",

                productVersion:
                    "1.2"

            });

            document.getElementById("loading").style.display =
                "none";

            /*
             * Don't revoke the URLs immediately because
             * Unity may still need them.
             */
        };

        script.onerror = function () {
            throw new Error(
                "Could not load Build/FinalBuild.loader.js"
            );
        };

        document.body.appendChild(script);

    } catch (error) {

        console.error(error);

        const errorBox =
            document.getElementById("error");

        errorBox.style.display = "block";

        errorBox.textContent =
            "Game loading failed:\n\n" +
            error.stack;
    }
}

createGame();
</script>

</body>
</html>
